crop_id: wheat
name: Wheat
scientific_name: Triticum aestivum

climate_envelope:
  thresholds:
    mean_annual_temp_c:
      viable_min: 5.0
      optimal_min: 10.0
      optimal_max: 20.0
      viable_max: 25.0

    annual_precipitation_mm:
      viable_min: 200.0
      optimal_min: 400.0
      optimal_max: 900.0
      viable_max: 1200.0

    altitude_m:
      viable_min: 0.0
      optimal_min: 0.0
      optimal_max: 2500.0
      viable_max: 3000.0

frost_threshold_c: -5.0
precip_viable_min_mm: 200.0
precip_optimal_min_mm: 400.0
heat_max_threshold_c: 30.0

calibration_anchors:
  - id: karacadag_anatolia
    name: Karacadağ — Southern Anatolia
    role: origin_center
    bbox: [38.0, 37.0, 40.5, 38.5]
    notes: "Archaeological and genetic origin of einkorn wheat domestication (~10,000 BCE). Declining scores in this zone represent pressure on the birthplace of grain agriculture."

  - id: punjab_pakistan
    name: Punjab — Pakistan / Northwest India
    role: production_reference
    bbox: [73.0, 29.0, 77.0, 32.5]
    notes: "One of the world's most productive wheat belts. Critical smallholder and food-security zone for South Asia. Scores should reflect optimal winter wheat growing conditions."

  - id: rajasthan_heat_stress
    name: Rajasthan — Northwestern India
    role: stress_reference
    bbox: [71.0, 24.5, 76.0, 28.0]
    notes: "Documented heat stress at grain fill stage. Early terminal heat events (March–April) before harvest are increasing in frequency. High scores here indicate the model is missing late-season thermal stress effects on yield."
