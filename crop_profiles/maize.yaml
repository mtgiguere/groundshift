crop_id: maize
name: Maize
scientific_name: Zea mays

climate_envelope:
  thresholds:
    mean_annual_temp_c:
      viable_min: 10.0
      optimal_min: 18.0
      optimal_max: 28.0
      viable_max: 38.0

    annual_precipitation_mm:
      viable_min: 400.0
      optimal_min: 600.0
      optimal_max: 1000.0
      viable_max: 1400.0

    altitude_m:
      viable_min: 0.0
      optimal_min: 0.0
      optimal_max: 2500.0
      viable_max: 3400.0

frost_threshold_c: 2.0
precip_viable_min_mm: 400.0
precip_optimal_min_mm: 600.0
heat_max_threshold_c: 35.0

calibration_anchors:
  - id: iowa_corn_belt
    name: Iowa — US Corn Belt
    role: origin_center
    bbox: [-95.5, 41.0, -91.5, 43.5]
    notes: "Most productive maize zone on earth under managed conditions. Reference for peak suitability ceiling."

  - id: ethiopia_central_highlands
    name: Ethiopia — Jimma / Wolega Highlands
    role: production_reference
    bbox: [35.5, 7.0, 38.5, 9.5]
    notes: "Primary smallholder maize production zone in East Africa. Climate-vulnerable; food security implications."

  - id: brazil_nordeste
    name: Brazil — Nordeste Semi-Arid
    role: stress_reference
    bbox: [-42.0, -8.5, -38.0, -5.0]
    notes: "Chronic drought stress and erratic rainfall. Documented yield collapse years. High scores here indicate the model is underestimating precipitation deficit."
